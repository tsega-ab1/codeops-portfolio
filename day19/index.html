<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Addis Market — Shopping List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Addis Market Shopping List</h1>

  <form id="add-form">
    <input id="name" type="text" placeholder="Item name" required>
    <input id="price" type="number" placeholder="Price (ETB)" required>
    <button type="submit">Add</button>
  </form>

  <ul id="list"></ul>

  <p>Total: <span id="total">0</span> ETB</p>

  <script src="app.js"></script>
</body>
</html>
