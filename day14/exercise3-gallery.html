<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercise 3 — Auto-fit Gallery</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; margin: 24px; }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
  }

  .photo {
    background: #1B4D8E;
    color: #fff;
    aspect-ratio: 4 / 3;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <h1>Photo Gallery</h1>
  <div class="gallery">
    <div class="photo">1</div>
    <div class="photo">2</div>
    <div class="photo">3</div>
    <div class="photo">4</div>
    <div class="photo">5</div>
    <div class="photo">6</div>
  </div>
  <p>No media query here — resize the window and watch the column count change on its own.</p>
</body>
</html>
