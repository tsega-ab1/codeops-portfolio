<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercise 1 — Flexbox Navbar</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; margin: 0; }

  .navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    background: #1B4D8E;
    color: #fff;
  }

  .logo {
    font-weight: 700;
    font-size: 1.25rem;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .nav-links a {
    color: #fff;
    text-decoration: none;
  }

  .nav-links button {
    background: #D4A027;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">Habesha Market</div>
    <div class="nav-links">
      <a href="#shop">Shop</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
      <button>Sign In</button>
    </div>
  </nav>
</body>
</html>
