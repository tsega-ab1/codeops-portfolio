<!doctype html>
<html>
  <head>
    <title>Birr Watch</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Birr Watch</h1>

    <p id="status">Loading rates…</p>

    <form id="convert-form">
      <input id="amount" type="number" value="100" />
      <select id="currency"></select>
      <button>Convert</button>
    </form>

    <p id="result"></p>

    <h2>Watchlist</h2>
    <button id="watch">Add Currency</button>
    <ul id="watchlist"></ul>

    <script src="app.js"></script>
  </body>
</html>
